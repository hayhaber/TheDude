    <g fill="none" stroke="#2a2e35" stroke-width="3" stroke-linecap="round">
      <path d="M506 280 c-2 -30 2 -64 10 -82 c8 -10 12 6 4 18 c-10 16 -22 26 -22 40 c0 14 14 20 24 12 c8 -8 2 -22 -10 -18 c-8 4 -6 16 0 18"/>
      <path d="M506 430 c-2 -30 2 -64 10 -82 c8 -10 12 6 4 18 c-10 16 -22 26 -22 40 c0 14 14 20 24 12 c8 -8 2 -22 -10 -18 c-8 4 -6 16 0 18"/>
