    <path d="M816 158 L460 140 L460 652 L824 626 Z" fill="#e8dfcc"/>
    <!-- left page -->
    <path d="M92 150 L444 134 L444 646 L86 618 Z" fill="url(#pg)"/>
    <!-- right page -->
    <path d="M808 150 L456 134 L456 646 L814 618 Z" fill="url(#pg2)"/>
    <!-- gutter -->
    <path d="M444 134 L456 134 L456 646 L444 646 Z" fill="#d9cfb8"/>

    <!-- left page: lyric lines with chord names above -->
    <g stroke="#c9d6ea" stroke-width="2">
      <path d="M118 236 L420 226"/><path d="M118 316 L420 306"/><path d="M118 396 L420 386"/>
      <path d="M118 476 L420 466"/><path d="M118 556 L420 546"/>
