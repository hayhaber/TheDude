      <text x="292" y="194" transform="rotate(-2 292 194)">F</text>
      <text x="160" y="278" transform="rotate(-2 160 278)">C</text>
      <text x="300" y="274" transform="rotate(-2 300 274)">G</text>
      <text x="160" y="358" transform="rotate(-2 160 358)">Am</text>
