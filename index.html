<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover + the safe-area CSS variables it enables is what
         lets the app draw edge-to-edge on an iPhone instead of leaving dead
         gray bars above/below where the notch and home-indicator are. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS ignores the manifest's icon list for the home-screen icon —
         it only ever reads this tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DudeStar" />
    <meta name="theme-color" content="#863bff" />
    <title>DudeStar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
