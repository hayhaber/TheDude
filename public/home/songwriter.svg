<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.86" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e9e1cf"/>
    </linearGradient>
    <linearGradient id="pg2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.86" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e6ddc9"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#1b2538"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="0.45" stop-color="#15181d"/>
      <stop offset="1" stop-color="#2a2e35"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset="0.5" stop-color="#c79a3c"/>
      <stop offset="1" stop-color="#8f6a22"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

