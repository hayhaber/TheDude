      <path d="M160 226 c6 -14 10 -14 12 0 c3 -10 8 -10 10 0 c4 -12 9 -12 11 -1 M212 224 c5 -12 12 -12 14 -1 c2 -9 7 -9 9 0 c3 -11 10 -11 12 -2 c3 -6 7 -6 9 -1 M268 222 c4 -13 9 -13 12 -2 c3 -10 9 -10 11 -1 M300 221 c6 -12 12 -12 14 -1 c3 -8 8 -8 10 0 c4 -11 10 -11 13 -2 c3 -7 8 -7 10 -1 c4 -9 9 -9 12 -2"/>
      <path d="M160 306 c5 -12 11 -12 13 -1 c3 -10 9 -10 11 -1 c4 -12 10 -12 12 -2 M206 304 c6 -13 11 -13 13 -2 c3 -9 8 -9 10 -1 M240 303 c5 -12 10 -12 12 -2 c3 -10 9 -10 12 -1 c3 -7 8 -7 10 -1 c4 -11 10 -11 13 -2 M310 300 c6 -12 12 -12 14 -2 c3 -9 9 -9 11 -1 c4 -10 9 -10 12 -2 c3 -7 7 -7 9 -1"/>
      <path d="M160 386 c5 -12 10 -12 12 -1 c3 -9 8 -9 11 -1 c4 -12 10 -12 12 -2 c3 -6 7 -6 9 -1 M222 384 c5 -13 11 -13 13 -2 c3 -10 9 -10 11 -1 M262 383 c4 -12 10 -12 12 -2 c3 -9 9 -9 11 -1 c4 -11 9 -11 12 -2 M318 381 c5 -12 11 -12 13 -2 c3 -8 8 -8 10 -1 c3 -10 9 -10 11 -2"/>
      <path d="M160 466 c5 -12 10 -12 12 -1 c3 -10 9 -10 11 -2 M196 464 c6 -12 12 -12 14 -2 c3 -9 8 -9 10 -1 c4 -11 9 -11 12 -2" opacity="0.55"/>
