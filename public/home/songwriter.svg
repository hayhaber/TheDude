    <rect x="-150" y="-13" width="14" height="26" fill="url(#gold)"/>
    <rect x="66" y="-13" width="10" height="26" fill="url(#gold)"/>
    <path d="M-150 -13 L-40 -13 L-40 -19 L-150 -19 Z" fill="url(#gold)"/>
    <path d="M120 -13 L170 -3 L176 0 L170 3 L120 13 Z" fill="url(#gold)"/>
    <path d="M150 -1 L176 0 L150 1" stroke="#5a4214" stroke-width="1.4"/>
    <rect x="-200" y="-9" width="300" height="4" rx="2" fill="#fff" opacity="0.18"/>
  </g>
