      <ellipse cx="610" cy="234" rx="9" ry="6.5" transform="rotate(-22 610 234)"/>
      <ellipse cx="654" cy="227" rx="9" ry="6.5" transform="rotate(-22 654 227)"/>
      <ellipse cx="704" cy="219" rx="9" ry="6.5" transform="rotate(-22 704 219)"/>
      <ellipse cx="752" cy="231" rx="9" ry="6.5" transform="rotate(-22 752 231)"/>
      <ellipse cx="566" cy="391" rx="9" ry="6.5" transform="rotate(-22 566 391)"/>
      <ellipse cx="612" cy="377" rx="9" ry="6.5" transform="rotate(-22 612 377)"/>
      <ellipse cx="660" cy="384" rx="9" ry="6.5" transform="rotate(-22 660 384)"/>
    </g>
    <g stroke="#1e2228" stroke-width="2.4">
      <path d="M574 245 L574 202"/><path d="M618 231 L618 188"/><path d="M662 224 L662 181"/>
      <path d="M712 216 L712 173"/><path d="M760 228 L760 185"/>
      <path d="M574 388 L574 345"/><path d="M620 374 L620 331"/><path d="M668 381 L668 338"/>
    </g>
    <path d="M574 202 L618 188" stroke="#1e2228" stroke-width="6"/>
    <path d="M662 181 L712 173" stroke="#1e2228" stroke-width="6"/>
    <path d="M790 206 L790 262" stroke="#7d8594" stroke-width="2"/>
