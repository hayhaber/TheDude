<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760">
  <defs>
    <radialGradient id="spot" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffd27a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a6" stop-opacity=".0"/>
      <stop offset=".35" stop-color="#ffe2a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffe2a6" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2b30"/>
      <stop offset=".45" stop-color="#8d909a"/>
      <stop offset=".6" stop-color="#cfd2da"/>
      <stop offset="1" stop-color="#3a3c43"/>
    </linearGradient>
    <linearGradient id="standDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2d33"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece8de"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ebf0"/>
      <stop offset=".5" stop-color="#9da1ab"/>
      <stop offset="1" stop-color="#4b4e57"/>
    </linearGradient>
    <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="none"/>
      <path d="M0 0H7M0 0V7" stroke="#3a3c44" stroke-width="1.1" opacity=".55"/>
    </pattern>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".30"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34353c"/>
      <stop offset="1" stop-color="#16161a"/>
    </linearGradient>
  </defs>

  <!-- the spotlight -->
  <path d="M370 0 L520 0 L780 690 L110 690 Z" fill="url(#beam)"/>
  <ellipse cx="445" cy="690" rx="360" ry="62" fill="url(#spot)"/>
  <ellipse cx="445" cy="700" rx="330" ry="34" fill="url(#floor)"/>

  <!-- floor monitor (wedge) -->
  <g>
    <ellipse cx="190" cy="706" rx="120" ry="16" fill="#000" opacity=".22"/>
    <path d="M86 700 L104 618 L282 600 L300 700 Z" fill="url(#wedge)"/>
    <path d="M104 618 L282 600 L300 700" fill="none" stroke="#4a4b53" stroke-width="3"/>
    <path d="M122 628 L268 613 L282 688 L110 694 Z" fill="#1d1e23"/>
    <path d="M122 628 L268 613 L282 688 L110 694 Z" fill="url(#mesh)" opacity=".8"/>
  </g>

  <!-- the music stand -->
  <g>
    <ellipse cx="420" cy="712" rx="110" ry="14" fill="#000" opacity=".25"/>
    <rect x="414" y="470" width="12" height="222" rx="6" fill="url(#metal)"/>
    <path d="M420 660 L340 712 M420 660 L500 712 M420 660 L420 716" stroke="#26272c" stroke-width="9" stroke-linecap="round"/>
    <rect x="410" y="560" width="20" height="16" rx="4" fill="#1b1c20"/>
    <!-- desk, tilted back -->
    <path d="M262 236 L578 222 L590 470 L250 486 Z" fill="url(#standDesk)"/>
    <path d="M250 486 L590 470 L592 488 L248 504 Z" fill="#0d0d10"/>
    <!-- the sheet: words with chords over them -->
    <g transform="rotate(-2.5 420 360)">
      <rect x="290" y="232" width="262" height="240" rx="4" fill="url(#paper)"/>
      <rect x="306" y="248" width="94" height="10" rx="5" fill="#ff9f0a" opacity=".85"/>
      <g fill="#2f6fdf">
        <rect x="306" y="272" width="16" height="7" rx="2"/>
        <rect x="380" y="272" width="16" height="7" rx="2"/>
        <rect x="462" y="272" width="22" height="7" rx="2"/>
      </g>
      <g fill="#2b2b30">
        <rect x="306" y="286" width="206" height="8" rx="4"/>
        <rect x="306" y="304" width="170" height="8" rx="4"/>
      </g>
      <g fill="#2f6fdf">
        <rect x="306" y="326" width="16" height="7" rx="2"/>
        <rect x="430" y="326" width="16" height="7" rx="2"/>
      </g>
      <g fill="#2b2b30">
        <rect x="306" y="340" width="226" height="8" rx="4"/>
        <rect x="306" y="358" width="140" height="8" rx="4"/>
      </g>
      <rect x="306" y="384" width="74" height="10" rx="5" fill="#ff9f0a" opacity=".85"/>
      <g fill="#2f6fdf">
        <rect x="306" y="406" width="22" height="7" rx="2"/>
        <rect x="402" y="406" width="16" height="7" rx="2"/>
      </g>
      <g fill="#2b2b30">
        <rect x="306" y="420" width="196" height="8" rx="4"/>
        <rect x="306" y="438" width="120" height="8" rx="4"/>
      </g>
    </g>
    <path d="M262 236 L578 222" stroke="#45464e" stroke-width="3"/>
  </g>

  <!-- the microphone on its stand -->
  <g>
    <ellipse cx="690" cy="712" rx="92" ry="13" fill="#000" opacity=".25"/>
    <rect x="684.5" y="296" width="11" height="396" rx="5.5" fill="url(#metal)"/>
    <path d="M690 668 L622 712 M690 668 L758 712 M690 668 L690 716" stroke="#26272c" stroke-width="8" stroke-linecap="round"/>
    <rect x="680" y="420" width="20" height="18" rx="4" fill="#1b1c20"/>
    <!-- clip + body -->
    <rect x="680" y="288" width="20" height="16" rx="4" fill="#1b1c20"/>
    <g transform="rotate(-28 652 214)">
      <rect x="637" y="214" width="30" height="96" rx="12" fill="#1c1d22"/>
      <rect x="637" y="214" width="30" height="96" rx="12" fill="url(#metal)" opacity=".35"/>
      <rect x="633" y="208" width="38" height="14" rx="5" fill="#9aa0ab"/>
      <ellipse cx="652" cy="168" rx="34" ry="46" fill="url(#grille)"/>
      <ellipse cx="652" cy="168" rx="34" ry="46" fill="url(#mesh)"/>
      <ellipse cx="652" cy="168" rx="34" ry="46" fill="none" stroke="#5c606a" stroke-width="3"/>
      <path d="M622 160 Q652 150 682 160" stroke="#c6c9d1" stroke-width="3" fill="none"/>
      <ellipse cx="640" cy="146" rx="9" ry="16" fill="#fff" opacity=".45"/>
    </g>
    <!-- cable -->
    <path d="M690 450 C 650 520, 720 600, 640 700 S 560 720, 520 716" stroke="#1a1a1e" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
